/* editar / criar projeto */
const PCOLORS=['var(--blue)','var(--indigo)','var(--green)','var(--orange)','var(--red)','var(--pink)','var(--teal)','var(--gray)'];
const PICONS=['rocket','bulb','spark','wallet','plane','chat','house','code','heart','star','folder','note'];
let draft=null;
function editProj(id){
  const p=id?S.projects.find(x=>x.id===id):null;delArm=false;
  if(p){const d=pData(p);draft={name:p.name,desc:p.desc,color:p.color,icon:p.icon,status:p.status,cat:p.cat,dest:d.dest||'',start:d.start||'',end:d.end||'',goal:d.goal||'',goalH:d.goalH||''}}
  else draft={name:'',desc:'',color:'var(--blue)',icon:'folder',status:'ativo',cat:null,dest:'',start:'',end:'',goal:'',goalH:''};
  drawEdit(id);
}
function pickCat(k,id){draft.cat=k;if(!id){draft.icon=PCATS[k].i;draft.color=PCATS[k].c}drawEdit(id)}
function drawEdit(id){const q=id?`'${id}'`:'';
  if(!id&&!draft.cat){openSheet(`<h2>Novo projeto</h2><div class="sm l2" style="margin-top:2px">Que tipo de projeto é? Cada tipo vem com ferramentas próprias.</div>
    <div style="display:grid;gap:10px;margin-top:16px">${Object.entries(PCATS).map(([k,c])=>`<button class="catpick" onclick="pickCat('${k}')">${sq(c.i,c.c,'width:44px;height:44px;border-radius:13px;font-size:22px')}<div style="flex:1;text-align:left"><b style="display:block;font-size:17px;font-weight:600">${c.l}</b><span class="sm l2">${c.d}</span></div><span class="l3" style="transform:rotate(180deg);display:flex">${ic('back')}</span></button>`).join('')}</div>`);return}
  const cat=draft.cat;
  openSheet(`<h2>${id?'Editar projeto':'Novo projeto · '+PCATS[cat].l}</h2>
  <span class="lbl">Nome</span><input class="field" id="pjName" value="${esc(draft.name)}" placeholder="${cat==='viagem'?'Ex: Férias de julho':cat==='negocio'?'Ex: Meu produto digital':cat==='estudo'?'Ex: Espanhol B2':'Ex: Organizar a casa'}" oninput="draft.name=this.value">
  ${cat==='viagem'?`<span class="lbl">Destino</span><input class="field" value="${esc(draft.dest)}" placeholder="Ex: Lisboa e Porto" oninput="draft.dest=this.value">
    <div class="flex" style="gap:10px"><div style="flex:1"><span class="lbl">Ida</span><input class="field" type="date" value="${draft.start}" oninput="draft.start=this.value"></div><div style="flex:1"><span class="lbl">Volta</span><input class="field" type="date" value="${draft.end}" oninput="draft.end=this.value"></div></div>`:''}
  ${cat==='negocio'?`<span class="lbl">Meta de faturamento (R$)</span><input class="field num" type="number" inputmode="decimal" value="${draft.goal}" placeholder="Ex: 5000" oninput="draft.goal=this.value">`:''}
  ${cat==='estudo'?`<span class="lbl">Meta de horas</span><input class="field num" type="number" inputmode="decimal" value="${draft.goalH}" placeholder="Ex: 100" oninput="draft.goalH=this.value">`:''}
  <span class="lbl">Descrição</span><input class="field" value="${esc(draft.desc)}" placeholder="Em uma frase, o que é?" oninput="draft.desc=this.value">
  ${id?`<span class="lbl">Tipo</span><div class="chips">${Object.entries(PCATS).map(([k,c])=>`<button class="pill ${draft.cat===k?'acc':'fill'}" onclick="draft.cat='${k}';drawEdit(${q})">${c.l}</button>`).join('')}</div>`:''}
  <span class="lbl">Status</span><div class="chips">${Object.entries(STATUS).map(([k,[l]])=>`<button class="pill ${draft.status===k?'acc':'fill'}" onclick="draft.status='${k}';drawEdit(${q})">${l}</button>`).join('')}</div>
  <span class="lbl">Cor</span><div class="chips">${PCOLORS.map(c=>`<button class="swatch ${draft.color===c?'on':''}" style="background:${c}" onclick="draft.color='${c}';drawEdit(${q})"></button>`).join('')}</div>
  <span class="lbl">Ícone</span><div class="chips">${PICONS.map(i=>`<button class="icopick ${draft.icon===i?'on':''}" onclick="draft.icon='${i}';drawEdit(${q})">${ic(i)}</button>`).join('')}</div>
  <button class="btn" onclick="saveProj(${q})">${id?'Salvar':'Criar projeto'}</button>
  ${!id?`<button class="sm l2" style="width:100%;margin-top:12px" onclick="draft.cat=null;drawEdit()">Trocar tipo</button>`:''}
  ${id?`<button class="btn gr" style="color:var(--red)" onclick="delProj('${id}')">${delArm?'Toque de novo para excluir':'Excluir projeto'}</button>`:''}`);
}
function saveProj(id){
  if(!draft.name.trim()){$('#pjName').focus();return}
  const base={name:draft.name.trim(),desc:draft.desc,color:draft.color,icon:draft.icon,status:draft.status,cat:draft.cat};
  let p;
  if(id){p=S.projects.find(x=>x.id===id);const old=p.name;Object.assign(p,base);if(old!==p.name)S.ideas.forEach(i=>{if(i.tag===old)i.tag=p.name})}
  else{p={id:uid(),...base,tasks:TEMPLATES[draft.cat].map(t=>({id:uid(),title:t,done:false})),log:[],notes:'',data:{}};S.projects.push(p);openPid=p.id;pTab=''}
  const d=pData(p);
  if(p.cat==='viagem')Object.assign(d,{dest:draft.dest,start:draft.start,end:draft.end});
  if(p.cat==='negocio')d.goal=+draft.goal||0;
  if(p.cat==='estudo')d.goalH=+draft.goalH||0;
  save();closeSheet();render();window.scrollTo({top:0});toast(id?'Projeto salvo':'Projeto criado')}
function delProj(id){if(!delArm){delArm=true;drawEdit(id);return}
  S.projects=S.projects.filter(x=>x.id!==id);openPid=null;save();closeSheet();render();toast('Projeto excluído')}

function payBill(id,toggle){const b=S.bills.find(x=>x.id===id);const was=isPaid(b);
  if(was&&toggle){b.paidMonth=null;if(b.inst)b.inst.paid=Math.max(0,b.inst.paid-1);if(b.txId)S.tx=S.tx.filter(t=>t.id!==b.txId);b.txId=null;save();render();return}
  if(was)return;
  b.paidMonth=TODAY().slice(0,7);if(b.inst)b.inst.paid=Math.min(b.inst.total,b.inst.paid+1);
  const t={id:uid(),type:'out',amount:b.amount,cur:b.cur,cat:b.cat||(catOf(b.name)==='Outros'?'Casa':catOf(b.name)),desc:b.inst?`${b.name} (${b.inst.paid}/${b.inst.total})`:b.name,date:TODAY()};
  S.tx.push(t);b.txId=t.id;save();render();
  toast(b.inst&&b.inst.paid>=b.inst.total?b.name+' quitado':b.name+' paga')}

let brk=null;
function breakTask(id,title){
  const t=id?S.tasks.find(x=>x.id===id):{title:title||''};
  brk={id,title:t.title,pid:(!id&&openPid)?openPid:null,steps:null,keep:true};

  aiCall('break',t.title).then(r=>{if(!brk)return;brk.steps=(r.passos||[]).map(s=>({t:cap(String(s).trim()),on:true})).filter(s=>s.t);if(!brk.steps.length)throw 0;drawBreak()})
    .catch(()=>{if(!brk)return;openSheet(`<h2>Quebrar em passos</h2><div class="empty">Não consegui falar com a IA agora. Tente de novo em instantes.</div><button class="btn gr" onclick="closeSheet()">Fechar</button>`)});

function drawBreak(){
  openSheet(`<h2>Quebrar em passos</h2><div class="l2" style="margin-top:2px">${esc(brk.title)}</div>
  <div class="list" style="background:var(--fill);margin-top:16px">${brk.steps.map((s,i)=>`<div class="row"><button class="chk ${s.on?'on':''}" onclick="brk.steps[${i}].on=!brk.steps[${i}].on;drawBreak()">${ic('check')}</button><div class="t"><b style="white-space:normal;font-weight:500">${esc(s.t)}</b>${i===0?'<span>Comece por este</span>':''}</div></div>`).join('')}</div>
  <label class="flex sm l2" style="gap:8px;margin:12px 4px 0"><input type="checkbox" ${brk.keep?'':'checked'} onchange="brk.keep=!this.checked" style="width:18px;height:18px;accent-color:var(--blue)"> Substituir a tarefa original pelos passos</label>
  <button class="btn" onclick="applyBreak()">Adicionar ${brk.steps.filter(s=>s.on).length} passos</button>
  <button class="sm l2" style="width:100%;margin-top:12px" onclick="breakTask(${brk.id?`'${brk.id}'`:'null'},brk.title)">Gerar de novo</button>`)}
function applyBreak(){
  const steps=brk.steps.filter(s=>s.on).map(s=>s.t);if(!steps.length)return;
  if(brk.pid){const p=S.projects.find(x=>x.id===brk.pid);const i=p.tasks.findIndex(x=>!x.done&&x.title===brk.title);
    const add=steps.map(s=>({id:uid(),title:s,done:false}));
    if(i>=0){p.tasks.splice(brk.keep?i+1:i,brk.keep?0:1,...add)}else p.tasks.push(...add)}
  else{const t=S.tasks.find(x=>x.id===brk.id);const date=t?t.date:TODAY();const i=S.tasks.indexOf(t);
    const add=steps.map(s=>({id:uid(),title:s,done:false,date}));
    if(i>=0){S.tasks.splice(brk.keep?i+1:i,brk.keep?0:1,...add)}else S.tasks.push(...add)}
  brk=null;save();closeSheet();render();toast('Passos adicionados')}

function parseAmount(s){
  const m=s.match(/(?:r\$\s*|\$\s*)?(\d{1,3}(?:[.\s]\d{3})+|\d+(?:,\d+)?)(\s*(?:mil|k)\b)?/i);
  if(!m)return null;
  let v=parseFloat(m[1].replace(/[.\s]/g,'').replace(',','.'));
  if(m[2])v*=1000;
  return {v,raw:m[0]};
}
function parseWhen(s){
  const l=s.toLowerCase();let date=null,time=null;
  if(/\bhoje\b/.test(l))date=TODAY();
  else if(/depois de amanh[ãa]/.test(l))date=addDays(2);
  else if(/amanh[ãa]/.test(l))date=addDays(1);
  const wds=['domingo','segunda','ter[cç]a','quarta','quinta','sexta','s[áa]bado'];
  wds.forEach((w,i)=>{if(new RegExp('\\b'+w).test(l)){const now=new Date().getDay();let d=(i-now+7)%7;if(d===0)d=7;date=addDays(d)}});
  const dm=l.match(/\bdia (\d{1,2})\b/);if(dm){const n=new Date();let d=new Date(n.getFullYear(),n.getMonth(),+dm[1]);if(d<new Date(n.toDateString()))d.setMonth(d.getMonth()+1);date=ds(d)}
  const tm=l.match(/(?:^|\s)[àa]s\s*(\d{1,2})(?:[:h](\d{2}))?\s*h?(?=\s|$|[,.])/)||l.match(/(?:^|\s)(\d{1,2})h(\d{2})?(?=\s|$|[,.])/);
  if(tm)time=`${pad(+tm[1])}:${tm[2]||'00'}`;
  return {date,time};
}
const clean=s=>cap((' '+s+' ').replace(/\s(hoje|amanh[ãa]|depois de amanh[ãa]|(na |no |nessa |essa )?(segunda|ter[cç]a|quarta|quinta|sexta)(-feira)?|(no |nesse )?(s[áa]bado|domingo)|dia \d{1,2}|[àa]s \d{1,2}([:h]\d{2})?h?|\d{1,2}h(\d{2})?)(?=[\s,.;])/gi,' ')
  .trim().replace(/^(preciso|tenho que|tenho de|lembrar de|lembrar|me lembra de|me lembre de|n[ãa]o esquecer de)\s+/i,'').replace(/\s{2,}/g,' ').trim().replace(/[,.;]$/,''));

function classify(c){
  const l=c.toLowerCase().trim();if(!l)return null;
  const pm=c.match(/^\s*([^:]{2,40}):\s*(.+)$/);
  if(pm){const pj=S.projects.find(x=>x.name.toLowerCase()===pm[1].trim().toLowerCase());
    if(pj){if(/^(ideia|id[ée]ia)\b/i.test(pm[2]))return{kind:'pidea',pid:pj.id,pname:pj.name,text:cap(pm[2].replace(/^(ideia|id[ée]ia)\b[:\s]*/i,'').trim())};
      return{kind:'ptask',pid:pj.id,pname:pj.name,title:clean(pm[2])}}}
  if(/^(ideia|id[ée]ia|anotar|nota)\b[:\s]*/i.test(l)){const text=cap(c.replace(/^(ideia|id[ée]ia|anotar|nota)\b[:\s]*/i,'').trim());
    const pj=S.projects.find(x=>new RegExp('\\b'+x.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'\\b','i').test(text));
    const tag=pj?pj.name:'Geral';
    return{kind:'idea',text,tag}}
  if(/(grat[oa]|gratid[ãa]o|agrade[çc])/i.test(l))return{kind:'grat',text:cap(c.replace(/^(eu\s+)?(sou|estou|me sinto)?\s*(grat[oa]|agradecid[oa])\s*/i,'').replace(/^(eu\s+)?agrade[çc]o\s*/i,'').trim())};
  const a=parseAmount(l.replace(/\bdia \d{1,2}\b/g,' ').replace(/(^|\s)[àa]s\s*\d{1,2}([:h]\d{2})?h?/g,' ').replace(/\b\d{1,2}h(\d{2})?\b/g,' ').replace(/\b\d{1,2}:\d{2}\b/g,' '));
  const cur='BRL';
  if(a&&/(recebi|ganhei|comiss|sal[aá]rio|entrou|pagaram|me pagou)/i.test(l)){
    return{kind:'in',amount:a.v,cur,desc:/comiss/i.test(l)?'Comissão':cap(c.replace(a.raw,'').replace(/\b(recebi|ganhei|de|reais|pesos)\b/gi,'').replace(/\s{2,}/g,' ').trim())||'Entrada'}}
  const w=parseWhen(c);
  if(a&&!/[àa]s\s*\d/.test(l)&&(/(gastei|paguei|comprei|custou|gasto|conta de)/i.test(l)||catOf(l)!=='Outros'||/^\D{0,25}\d/.test(l))){
    const cat=catOf(l);
    let desc=c.replace(a.raw,'').replace(/\b(gastei|paguei|comprei|custou|no|na|em|de|com|pesos|reais|mil)\b/gi,' ').replace(/\s{2,}/g,' ').trim();
    return{kind:'out',amount:a.v,cur,cat,desc:cap(desc)||cat}}
  if(w.time||/(reuni[ãa]o|consulta|encontro|entrevista|call|jantar com|almo[cç]o com|academia|aula)/i.test(l)){
    const imp=/\bimportante\b/i.test(l);
    return{kind:'event',title:clean(c.replace(/\s*[-–,]?\s*\bimportante\b/ig,'')),date:w.date||TODAY(),time:w.time||'09:00',imp}}
  return{kind:'task',title:clean(c),date:w.date||TODAY()};
}
const AI_URL='https://vida-app.irobruno2.workers.dev';
async function aiCall(task,text,extra={}){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),20000);
  try{const r=await fetch(AI_URL,{method:'POST',headers:{'Content-Type':'application/json'},signal:ctl.signal,
      body:JSON.stringify({task,text,today:TODAY(),weekday:new Date().toLocaleDateString('pt-BR',{weekday:'long'}),...extra})});
    if(!r.ok)throw new Error('http '+r.status);return await r.json()}
  finally{clearTimeout(to)}
}
const okDate=d=>/^\d{4}-\d{2}-\d{2}$/.test(d||'')&&!isNaN(parseD(d));
const okTime=t=>/^\d{1,2}:\d{2}$/.test(t||'')?t.padStart(5,'0'):null;
function fromAI(it){
  const tx=cap(String(it.texto||'').trim());if(!tx)return null;
  const findP=n=>S.projects.find(p=>p.name.toLowerCase()===String(n||'').toLowerCase().trim());
  switch(it.kind){
    case'gasto':{if(!(+it.valor>0))return null;const cat=CATS[it.categoria]&&it.categoria!=='Renda'?it.categoria:catOf(tx);return{kind:'out',amount:+it.valor,cur:'BRL',cat,desc:tx}}
    case'entrada':return +it.valor>0?{kind:'in',amount:+it.valor,cur:'BRL',desc:tx}:null;
    case'compromisso':return{kind:'event',title:tx,date:okDate(it.data)?it.data:TODAY(),time:okTime(it.hora)||'09:00',imp:!!it.importante};
    case'tarefa':return{kind:'task',title:tx,date:okDate(it.data)&&it.data>=TODAY()?it.data:TODAY()};
    case'ideia':{const pj=findP(it.projeto)||S.projects.find(x=>tx.toLowerCase().includes(x.name.toLowerCase()));return{kind:'idea',text:tx,tag:pj?pj.name:'Geral'}}
    case'gratidao':return{kind:'grat',text:tx};
    case'tarefa_projeto':{const pj=findP(it.projeto);return pj?{kind:'ptask',pid:pj.id,pname:pj.name,title:tx}:{kind:'task',title:tx,date:TODAY()}}
  }return null;
}
let aiBusy=false;
async function organize(){
  const v=$('#capIn').value.trim();if(!v||aiBusy)return;
  const btn=$('#orgBtn');aiBusy=true;if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Organizando…'}
  try{const r=await aiCall('capture',v,{projects:S.projects.filter(p=>p.status!=='feito').map(p=>p.name)});
    pending=(r.items||[]).map(fromAI).filter(Boolean);
    if(!pending.length)throw new Error('vazio');
    aiUsed=true;}
  catch(e){organizeLocal(v);aiUsed=false;toast('IA indisponível, organizei do jeito simples',true)}
  finally{aiBusy=false;if(btn){btn.disabled=false;btn.textContent='Organizar'}}
  drawPending();
}
let aiUsed=false;
function organizeLocal(v){
  const parts=v.split(/\s+e\s+(?=\S)|;|\n|\.\s+/).map(s=>s.trim()).filter(Boolean);
  const merged=[];parts.forEach(p=>{if(merged.length&&p.split(' ').length<2&&!/\d/.test(p))merged[merged.length-1]+=' e '+p;else merged.push(p)});
  pending=merged.map(classify).filter(Boolean);
}
function pv(p){
  const dl=d=>d===TODAY()?'hoje':d===addDays(1)?'amanhã':parseD(d).toLocaleDateString('pt-BR',{weekday:'short',day:'numeric'}).replace('.','');
  switch(p.kind){
    case'out':{const c=CATS[p.cat];return[sq(c.i,c.c),'GASTO · '+p.cat.toUpperCase(),`${esc(p.desc)} · ${fmt(p.amount,p.cur)}`]}
    case'in':return[sq('down','var(--green)'),'ENTRADA',`${esc(p.desc)} · ${fmt(p.amount,p.cur)}`];
    case'event':return[sq(p.imp?'star':'cal',p.imp?'var(--yellow)':'var(--red)',p.imp?'color:#000':''),p.imp?'COMPROMISSO IMPORTANTE':'COMPROMISSO',`${esc(p.title)} · ${dl(p.date)}, ${p.time}`];
    case'task':return[sq('check','var(--blue)'),'TAREFA',`${esc(p.title)} · ${dl(p.date)}`];
    case'idea':return[sq('bulb','var(--yellow)','color:#000'),'FAÍSCA'+(p.tag!=='Geral'?' · '+p.tag.toUpperCase():''),esc(p.text)];
    case'grat':return[sq('hands','var(--pink)'),'GRATIDÃO',esc(p.text)];
    case'ptask':{const pj=S.projects.find(x=>x.id===p.pid);return[sq(pj.icon,pj.color),'TAREFA · '+esc(p.pname).toUpperCase(),esc(p.title)]}
    case'pidea':return[sq('bulb','var(--yellow)','color:#000'),'IDEIA · '+esc(p.pname).toUpperCase(),esc(p.text)];
  }
}
function drawPending(){
  $('#prevs').innerHTML=pending.length?`<span class="lbl">${aiUsed?'A IA entendeu assim':'Entendi assim'}</span>`+pending.map((p,i)=>{const[e,a,b]=pv(p);
    return `<div class="prev" style="animation-delay:${i*60}ms">${e}<div class="t"><span>${a}</span><b>${b}</b></div><button class="x" onclick="pending.splice(${i},1);drawPending()">${ic('x')}</button></div>`}).join('')
    +`<button class="btn" onclick="commit()">Salvar${pending.length>1?' tudo':''}</button>`:'';
}
function commit(){
  pending.forEach(p=>{
    if(p.kind==='out')S.tx.push({id:uid(),type:'out',amount:p.amount,cur:p.cur,cat:p.cat,desc:p.desc,date:TODAY()});
    if(p.kind==='in')S.tx.push({id:uid(),type:'in',amount:p.amount,cur:p.cur,cat:'Renda',desc:p.desc,date:TODAY()});
    if(p.kind==='event')S.events.push({id:uid(),title:p.title,date:p.date,time:p.time,imp:!!p.imp});
    if(p.kind==='task')S.tasks.push({id:uid(),title:p.title,date:p.date,done:false});
    if(p.kind==='idea')S.ideas.push({id:uid(),text:p.text,tag:p.tag,date:TODAY(),done:false});
    if(p.kind==='grat')S.gratitude.push({id:uid(),text:p.text,date:TODAY()});
    if(p.kind==='ptask')S.projects.find(x=>x.id===p.pid)?.tasks.push({id:uid(),title:p.title,done:false});
    if(p.kind==='pidea')S.ideas.push({id:uid(),text:p.text,tag:p.pname,date:TODAY()});
  });
  const n=pending.length;save();closeSheet();render();
  toast(n>1?`${n} itens salvos`:'Salvo');
}

/* ---------- feedback ---------- */
let tt;function toast(m,warn){const t=$('#toast');t.innerHTML=`<span style="color:${warn?'var(--orange)':'var(--green)'};display:flex">${ic(warn?'x':'check')}</span>${esc(m)}`;t.style.whiteSpace=warn?'normal':'nowrap';t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1800)}
function burst(x,y){const cs=['#0A84FF','#30D158','#FF9F0A','#FF375F','#64D2FF','#FFD60A'];
  for(let i=0;i<16;i++){const s=document.createElement('i');s.className='cf';
    s.style.left=x+'px';s.style.top=y+'px';s.style.background=cs[i%cs.length];
    const a=i/16*Math.PI*2,d=34+Math.random()*30;
    s.style.setProperty('--dx',Math.cos(a)*d+'px');s.style.setProperty('--dy',Math.sin(a)*d+'px');
    document.body.appendChild(s);setTimeout(()=>s.remove(),1000)}}

/* ---------- céu estrelado ---------- */
function drawStars(){
  const c=$('#stars'),dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,hh=innerHeight;
  c.width=w*dpr;c.height=hh*dpr;const x=c.getContext('2d');x.scale(dpr,dpr);
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const n=Math.round(w*hh/2600);
  for(let i=0;i<n;i++){const px=rnd()*w,py=rnd()*hh,r=rnd()<.92?rnd()*.7+.2:rnd()*1.1+.8,a=rnd()*.55+.12;
    const tint=rnd();x.fillStyle=tint<.15?`rgba(255,226,200,${a})`:tint<.35?`rgba(190,210,255,${a})`:`rgba(255,255,255,${a})`;
    x.beginPath();x.arc(px,py,r,0,7);x.fill()}
  // poeira suave
  for(let i=0;i<60;i++){const px=rnd()*w,py=rnd()*hh,g=x.createRadialGradient(px,py,0,px,py,18+rnd()*30);
    g.addColorStop(0,'rgba(160,175,255,.035)');g.addColorStop(1,'rgba(160,175,255,0)');x.fillStyle=g;x.fillRect(px-50,py-50,100,100)}
  document.querySelectorAll('.tw').forEach(e=>e.remove());
  for(let i=0;i<16;i++){const s=document.createElement('i');s.className='tw';s.style.left=(rnd()*100)+'%';s.style.top=(rnd()*100)+'%';
    s.style.animationDelay=(-rnd()*4)+'s';s.style.animationDuration=(3+rnd()*4)+'s';$('#wall').appendChild(s)}
}
drawStars();let rsz;addEventListener('resize',()=>{clearTimeout(rsz);rsz=setTimeout(drawStars,200)});

render();
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
